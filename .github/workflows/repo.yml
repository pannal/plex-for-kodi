name: Kodi Repository

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Read addon metadata
        id: meta
        run: |
          ADDON_ID=$(grep -oP '(?<=id=")[^"]+' addon.xml | head -1)
          ADDON_VERSION=$(grep -oP '(?<=version=")[^"]+' addon.xml | head -1)
          echo "addon_id=$ADDON_ID" >> $GITHUB_OUTPUT
          echo "addon_version=$ADDON_VERSION" >> $GITHUB_OUTPUT

      - name: Build addon zip
        run: |
          ADDON_ID=${{ steps.meta.outputs.addon_id }}
          mkdir -p dist/${ADDON_ID}
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='tests' \
            --exclude='*.pyc' --exclude='__pycache__' \
            . dist/${ADDON_ID}/
          cd dist
          zip -r ../${ADDON_ID}-${GITHUB_REF_NAME}.zip ${ADDON_ID}/

      - name: Attach zip to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.addon_id }}-${{ github.ref_name }}.zip

      - name: Build Kodi repo index
        run: |
          ADDON_ID=${{ steps.meta.outputs.addon_id }}
          ADDON_VERSION=${{ steps.meta.outputs.addon_version }}
          ZIP_NAME="${ADDON_ID}-${GITHUB_REF_NAME}.zip"
          REPO_ID="repository.brwnj-plexmod"
          REPO_URL="https://brwnj.github.io/plex-for-kodi"

          mkdir -p repo/${ADDON_ID}
          mkdir -p repo/${REPO_ID}

          # Place addon zip and addon.xml
          cp ${ZIP_NAME} repo/${ADDON_ID}/
          cp addon.xml repo/${ADDON_ID}/
          [ -f icon2.png ] && cp icon2.png repo/${ADDON_ID}/icon.png || true
          [ -f fanart.png ] && cp fanart.png repo/${ADDON_ID}/fanart.png || true

          # Generate the repository addon.xml
          cat > repo/${REPO_ID}/addon.xml <<REPOXML
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <addon id="${REPO_ID}" name="brwnj PlexMod Repo" version="1.0.0" provider-name="brwnj">
            <requires>
              <import addon="xbmc.addon" version="12.0.0"/>
            </requires>
            <extension point="xbmc.addon.repository" name="brwnj PlexMod">
              <info compressed="false">${REPO_URL}/addons.xml</info>
              <checksum>${REPO_URL}/addons.xml.md5</checksum>
              <datadir zip="true">${REPO_URL}</datadir>
            </extension>
            <extension point="xbmc.addon.metadata">
              <summary>brwnj fork of PlexMod for Kodi</summary>
              <description>Unofficial Plex for Kodi with OSD fixes</description>
              <platform>all</platform>
            </extension>
          </addon>
          REPOXML

          # Build repo zip for the repository addon itself
          cd repo && zip -r ../${REPO_ID}.zip ${REPO_ID}/ && cd ..
          cp ${REPO_ID}.zip repo/

          # Generate addons.xml from all addon.xml files under repo/
          python3 - <<'EOF'
          import os, hashlib, xml.etree.ElementTree as ET

          addons = ET.Element("addons")
          for root, dirs, files in os.walk("repo"):
              if "addon.xml" in files:
                  tree = ET.parse(os.path.join(root, "addon.xml"))
                  addons.append(tree.getroot())

          tree = ET.ElementTree(addons)
          ET.indent(tree, space="    ")
          tree.write("repo/addons.xml", encoding="utf-8", xml_declaration=True)

          with open("repo/addons.xml", "rb") as f:
              md5 = hashlib.md5(f.read()).hexdigest()
          with open("repo/addons.xml.md5", "w") as f:
              f.write(md5)
          EOF

          # Simple index page
          cat > repo/index.html <<HTML
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>brwnj PlexMod Repo</title></head>
          <body>
          <h1>brwnj PlexMod Kodi Repository</h1>
          <p>In Kodi: <strong>Settings → File Manager → Add source</strong> →
          enter <code>${REPO_URL}</code></p>
          <p>Then: <strong>Add-ons → Install from zip file</strong> →
          pick that source → install <code>${REPO_ID}.zip</code></p>
          <p>After that Kodi will find and update PlexMod automatically.</p>
          <p>Latest: ${ADDON_ID} ${ADDON_VERSION} (${GITHUB_REF_NAME})</p>
          </body></html>
          HTML

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          keep_files: false
