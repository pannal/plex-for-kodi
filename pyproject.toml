[project]
name = "plex-for-kodi"
version = "0.0.0"
description = "Dev/test environment for the PM4K Kodi add-on. Not published."
requires-python = ">=3.9"

[dependency-groups]
dev = ["pytest", "requests", "six", "iso639-lang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = "*Test"
python_functions = "test_*"
# An unclosed xbmcvfs.File surfaces as a ResourceWarning, and on a Kodi box that
# is a leaked VFS handle. Keep them visible - but note they cannot be promoted to
# errors: the warning fires during garbage collection, outside any test's
# context, so pytest cannot attribute it to a test. The enforcing check is
# test_vfs_handles.py, which reads the source instead.
filterwarnings = ["always::ResourceWarning"]
